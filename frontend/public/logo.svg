<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" /> <!-- slate-900 -->
      <stop offset="100%" stop-color="#1e293b" /> <!-- slate-800 -->
    </linearGradient>
    
    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" /> <!-- sky-600 -->
      <stop offset="100%" stop-color="#0369a1" /> <!-- sky-700 -->
    </linearGradient>

    <!-- Cyan Accent Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circle Backdrop -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />

  <!-- Shield Shape -->
  <path d="M200 70 L110 105 L110 215 C110 280 145 330 200 355 C255 330 290 280 290 215 L290 105 Z" 
        fill="url(#shieldGrad)" 
        stroke="#38bdf8" 
        stroke-width="8" 
        stroke-linejoin="round" />

  <!-- The Checkmark -->
  <path d="M145 220 L185 260 L255 160" 
        fill="none" 
        stroke="#22d3ee" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />
</svg>
